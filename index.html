  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .toolbar select, .toolbar input { width:auto; min-width:120px; flex:1; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .work { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; position:relative; }
  .work.on { outline:3px solid var(--accent); }
  .work img, .work .noimg { width:100%; aspect-ratio:1; object-fit:contain; background:#f1efea; display:block; }
  .work .noimg { display:flex; align-items:center; justify-content:center; color:var(--muted); }

  .work .t { font-weight:600; font-size:14px; }

  .panel { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; max-width:760px; margin:0 auto 14px; }
  .bulk { background:#fff7ec; border:1px solid #ecd3ad; border-radius:10px; padding:10px; margin-bottom:12px; }
  .thumbs { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .thumbs div { position:relative; } .thumbs img { width:90px; height:90px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
  .thumbs button { position:absolute; top:2px; right:2px; padding:0 6px; font-size:12px; }
  .muted { color:var(--muted); font-size:13px; }
  .msg { padding:10px; border-radius:8px; background:#fff6e5; border:1px solid #f0d9a8; margin:10px 0; }
  .err { background:#fdecee; border-color:#f3bcc4; }
  .hidden { display:none !important; }
  table { width:100%; border-collapse:collapse; font-size:14px; } td, th { border-bottom:1px solid var(--line); padding:6px; text-align:left; vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  h2 { font-size:18px; margin:4px 0 10px; } h3 { font-size:15px; margin:16px 0 6px; }
  .count { font-size:13px; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips label { display:flex; gap:6px; align-items:center; margin:0; padding:5px 9px; border:1px solid var(--line); border-radius:16px; color:var(--ink); font-size:13px; }
  .chip { display:inline-flex; gap:6px; align-items:center; background:#efe7dc; border-radius:14px; padding:3px 10px; font-size:13px; }
  .chip button { border:0; background:none; padding:0 2px; }
  .pick { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; max-height:420px; overflow:auto; padding:4px; border:1px solid var(--line); border-radius:8px; }
  .pick label { display:block; margin:0; position:relative; border:1px solid var(--line); border-radius:8px; overflow:hidden; color:var(--ink); font-size:12px; cursor:pointer; background:#fff; }

async function resizeImage(file, max = 1800) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.86));
  } finally { URL.revokeObjectURL(url); }
}
async function uploadPhotos(work, files, startSort = 0) {
  let i = startSort;
  for (const f of files) {
    const blob = await resizeImage(f);
    const path = `${work.artist_id}/${work.id}/${crypto.randomUUID()}.jpg`;
    const up = await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg' });
    if (up.error) throw up.error;
    const ins = await sb.from('photos').insert({ work_id: work.id, path, sort: i++ });
    if (ins.error) throw ins.error;
  }
}

async function saveWork() {
  const title = $('eTitle').value.trim();
  if (!title) { msg($('eMsg'), t('needtitle'), true); return; }
  $('btnSave').disabled = true; msg($('eMsg'), t('saving'));
  const s = id => $(id).value.trim() || null;
  const rec = {
    artist_id: artistOf(), title, year: num($('eYear').value), edition: s('eEdition'), technique: s('eTech'), support: s('eSupport'),
    height_cm: num($('eH').value), width_cm: num($('eW').value), depth_cm: num($('eD').value),
    framed_height_cm: num($('eFH').value), framed_width_cm: num($('eFW').value), framed_depth_cm: num($('eFD').value),
    signature: s('eSig'), price_usd: num($('ePrice').value), status: $('eStatus').value,
    place_id: $('ePlace').value || null, date_consigned: $('eCons').value || null,
    owner_client_id: $('eOwner').value || null, sold_date: $('eSold').value || null, sale_price_usd: num($('eSale').value),
    notes: s('eNotes')
  };
  try {
    const r = editing ? await sb.from('works').update(rec).eq('id', editing.id).select().single()
                      : await sb.from('works').insert(rec).select().single();
    if (r.error) throw r.error;
    const w = r.data;
    const want = [...$('eExhs').querySelectorAll('input:checked')].map(i => i.value);
    const had = editing?.exh || [];
    const add = want.filter(x => !had.includes(x)), del = had.filter(x => !want.includes(x));
    if (add.length) { const a = await sb.from('exhibition_works').insert(add.map(e => ({ exhibition_id: e, work_id: w.id }))); if (a.error) throw a.error; }
    for (const e of del) await sb.from('exhibition_works').delete().eq('exhibition_id', e).eq('work_id', w.id);
    const files = pending.map(p => p.file);
    if (files.length) await uploadPhotos(w, files, (editing?.photos?.length || 0));
    pending = [];
    await loadWorks(); goWorks();
  } catch (e) { msg($('eMsg'), e.message || String(e), true); }
  finally { $('btnSave').disabled = false; }
}

  await sb.storage.from('photos').remove([p.path]);

  const paths = editing.photos.map(p => p.path);

}

  $('btnEntNew').textContent = t('addnew');
  const showOwner = E.owner && isAdmin;
  $('entTable').innerHTML = `<tr>${E.cols.map(c => `<th>${t(c[1])}</th>`).join('')}${showOwner ? `<th>${t('artist')}</th>` : ''}<th>${t('nworks')}</th><th></th></tr>` +
    rows.map(r => `<tr>${E.cols.map(([c]) => `<td>${esc(c === 'kind' ? t('k_' + r[c]) : (c.endsWith('_date') ? fmtDate(r[c]) : r[c]))}</td>`).join('')}
      ${showOwner ? `<td>${esc(r.artist_id ? artistName(r.artist_id) : t('groupshow'))}</td>` : ''}
      <td>${E.countBy(r)}</td><td style="white-space:nowrap">${(isAdmin || !E.owner || r.artist_id === myArtist?.id) ? `<button data-edit="${r.id}">${t('edit')}</button> ` : ''}<button data-show="${r.id}">${t('show')}</button></td></tr>`).join('');
  renderEntForm();
}
function renderEntForm() {
  const E = ENT[curEnt], r = entEditing || {};
  $('entFormHead').textContent = entEditing ? `${t('editing')}: ${entEditing.name || entEditing.title}` : t('addnew').replace('+ ', '');
  let html = '';
  if (E.owner && isAdmin) {
    html += `<label>${t('artist')}</label><select id="f_artist_id">${E.ownerOptional ? opt('', t('groupshow')) : ''}${artists.map(a => opt(a.id, a.name, r.artist_id === a.id)).join('')}</select>`;
  }
  for (const [col, lab, type] of E.fields) {
    const v = r[col] ?? '';
    html += `<label>${t(lab)}</label>`;
    if (type === 'textarea') html += `<textarea id="f_${col}" rows="2">${esc(v)}</textarea>`;
    else if (type === 'kind') html += `<select id="f_${col}">${KINDS.map(k => opt(k, t('k_' + k), v === k)).join('')}</select>`;
    else if (type === 'place') html += `<select id="f_${col}">${opt('', t('none'))}${places.map(p => opt(p.id, placeLabel(p), v === p.id)).join('')}</select>`;
    else html += `<input id="f_${col}" type="${type}" value="${esc(v)}">`;
  }
  if (curEnt === 'exhibitions') html += `<label>${t('pickworks')} <span id="pickCount"></span></label><div class="toolbar" style="margin:0 0 6px"><button type="button" id="pickAll">${t('pickall')}</button></div><div class="pick" id="exPick"></div>`;
  $('entForm').innerHTML = html;
  if (curEnt === 'exhibitions') {
    pickSel = new Set(entEditing ? works.filter(w => w.exh.includes(entEditing.id)).map(w => w.id) : []);
    renderPick();
    if ($('f_artist_id')) $('f_artist_id').onchange = renderPick;
    $('pickAll').onclick = () => { const l = pickList(); const all = l.length && l.every(w => pickSel.has(w.id)); l.forEach(w => all ? pickSel.delete(w.id) : pickSel.add(w.id)); renderPick(); };
    $('exPick').onchange = e => { const id = e.target.value; e.target.checked ? pickSel.add(id) : pickSel.delete(id); e.target.closest('label').classList.toggle('on', e.target.checked); $('pickCount').textContent = `(${pickSel.size})`; };
  }
  $('btnEntDel').classList.toggle('hidden', !entEditing);
  msg($('entMsg'), '');
}
async function saveEnt() {
  const E = ENT[curEnt], rec = {};
  for (const [col, , type] of E.fields) {
    const v = $('f_' + col).value.trim();
    rec[col] = v === '' ? null : (type === 'number' ? Number(v) : v);
  }
  if (curEnt === 'artists') { rec.code_prefix = (rec.code_prefix || '').toUpperCase() || null; if (rec.email) rec.email = rec.email.toLowerCase(); if (rec.commission_pct == null) rec.commission_pct = 0; }
  if (E.owner) rec.artist_id = isAdmin ? ($('f_artist_id').value || null) : myArtist.id;
  const req = curEnt === 'exhibitions' ? rec.title : rec.name;
  if (!req || (curEnt === 'artists' && !rec.code_prefix) || (E.owner && !E.ownerOptional && !rec.artist_id)) { msg($('entMsg'), t('needname'), true); return; }
  const r = entEditing ? await sb.from(E.table).update(rec).eq('id', entEditing.id).select().single() : await sb.from(E.table).insert(rec).select().single();
  if (r.error) { msg($('entMsg'), r.error.message, true); return; }
  if (curEnt === 'exhibitions') {
    const id = r.data.id;
    const had = works.filter(w => w.exh.includes(id)).map(w => w.id);
    const want = [...pickSel];
    const add = want.filter(x => !had.includes(x)), del = had.filter(x => !want.includes(x));
    if (add.length) { const a = await sb.from('exhibition_works').insert(add.map(w => ({ exhibition_id: id, work_id: w }))); if (a.error) { msg($('entMsg'), a.error.message, true); return; } }
    if (del.length) { const d = await sb.from('exhibition_works').delete().eq('exhibition_id', id).in('work_id', del); if (d.error) { msg($('entMsg'), d.error.message, true); return; } }
  }
  await loadAll(); entEditing = null; renderEnt(); msg($('entMsg'), t('saved'));
}
async function deleteEnt() {
  if (!entEditing || !confirm(t('confirmdel'))) return;
  const r = await sb.from(ENT[curEnt].table).delete().eq('id', entEditing.id);
  if (r.error) { msg($('entMsg'), r.error.message, true); return; }
  await loadAll(); entEditing = null; renderEnt();
}

  ['DOS VERSOS',2026,'Acrilico sobre tela de algodon',140,260,9000,'dos versos.jpeg'],
  ['GUIÑO DE MAR',2025,'Oleo sobre tela',152,122,7200,'Guinio de mar.jpeg'],

  ['ARQUITECTURA',2025,'Acrilico y Pastel sobre papel',76,56,1800,'arquitectura.jpeg'],

  ['VERSO',2025,'Acrilico y Pastel sobre papel',37,28,1400,'verso.jpeg'],
  ['Memoria de Egipto',2024,'Acrilico y Pastel sobre papel',42,31,1600,'Memorias de Egipto.jpeg']
];
async function runImport() {
  const out = $('iMsg'); $('btnIRun').disabled = true;
  try {
    const name = $('iName').value.trim(), email = $('iEmail').value.trim().toLowerCase() || null, prefix = $('iPrefix').value.trim().toUpperCase();
    let a = artists.find(x => x.code_prefix === prefix) || (email && artists.find(x => x.email === email));
    if (!a) { const r = await sb.from('artists').insert({ name, email, code_prefix: prefix }).select().single(); if (r.error) throw r.error; a = r.data; }
    const existing = await sb.from('works').select('id', { count: 'exact', head: true }).eq('artist_id', a.id);
    if (existing.count) { msg(out, t('importexists'), true); return; }
    const files = [...$('iFiles').files];
    const byName = n => files.find(f => f.name.trim().toLowerCase() === n.trim().toLowerCase());
    let n = 0;
    for (const [title, year, tech, h, w, price, fname] of CECILIA) {
      msg(out, `${++n}/14 · ${title}…`);
      const r = await sb.from('works').insert({ artist_id: a.id, title, year, technique: tech, height_cm: h, width_cm: w, price_usd: price, status: 'available', edition: t('unique') }).select().single();
      if (r.error) throw r.error;
      const f = byName(fname); if (f) await uploadPhotos(r.data, [f]);
    }
    await loadAll(); msg(out, t('importdone').replace('{n}', n));
  } catch (e) { msg(out, e.message || String(e), true); }
  finally { $('btnIRun').disabled = false; }
}

$('grid').onclick = e => {

  const card = e.target.closest('.work'); if (card) openEdit(works.find(w => w.id === card.dataset.id));
};
$('btnSelAll').onclick = () => { const f = filtered(); const all = f.length && f.every(w => selected.has(w.id)); f.forEach(w => all ? selected.delete(w.id) : selected.add(w.id)); renderList(); };
$('btnSelClear').onclick = () => { selected.clear(); renderList(); };
$('btnCards').onclick = () => printCards(printList());
$('btnCoas').onclick = () => printCoas(printList());

$('entTable').onclick = e => {
  const rows = entRows(curEnt);
  if (e.target.dataset.edit) { entEditing = rows.find(r => r.id === e.target.dataset.edit); renderEntForm(); window.scrollTo(0, document.body.scrollHeight); }

boot();
