<style>

  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  header { position:sticky; top:0; z-index:5; background:var(--ink); color:#fff; padding:8px 12px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0 8px 0 0; letter-spacing:.5px; }
  header .sp { flex:1; }
  header button { background:transparent; color:#fff; border:1px solid #555; padding:6px 10px; }
  header button.cur { background:#fff; color:var(--ink); }
  button { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:#b00020; border-color:#e6b8bf; }
  button:disabled { opacity:.5; }
  main { padding:14px; max-width:1100px; margin:0 auto; }
  input, select, textarea { font:inherit; width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  input[type=checkbox] { width:auto; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  label.req::after { content:' *'; color:#c0392b; font-weight:bold; }
  .reqnote { font-size:12px; color:var(--muted); margin:10px 0 0; }
  .reqnote b { color:#c0392b; }
  .missing { border-color:#c0392b !important; background:#fff5f4 !important; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .toolbar select, .toolbar input { width:auto; min-width:120px; flex:1; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .work { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; position:relative; }
  .work.on { outline:3px solid var(--accent); }
  .work img, .work .noimg { width:100%; aspect-ratio:1; object-fit:contain; background:#f1efea; display:block; }
  .work .noimg { display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .work .info { padding:8px 10px; font-size:13px; }
  .work .t { font-weight:600; font-size:14px; }
  .work .sel { position:absolute; top:8px; left:8px; width:26px; height:26px; accent-color:var(--accent); cursor:pointer; }
  .badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; background:#eee; }
  .b-available{background:#e3f1e5;color:#1d6b2c} .b-reserved{background:#fff1d6;color:#8a5a00} .b-sold{background:#f6dcdc;color:#9b1c1c} .b-loan{background:#e1e9f7;color:#244c8a}
  .panel { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; max-width:760px; margin:0 auto 14px; }
  .bulk { background:#fff7ec; border:1px solid #ecd3ad; border-radius:10px; padding:10px; margin-bottom:12px; }
  .thumbs { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .thumbs div { position:relative; } .thumbs img { width:90px; height:90px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
  .thumbs button { position:absolute; top:2px; right:2px; padding:0 6px; font-size:12px; }
  .thumbs button.star { right:auto; left:2px; color:#b07a2a; }
  .thumbs div.main img { outline:3px solid var(--accent); }
  .thumbs .mainlbl { position:absolute; bottom:3px; left:3px; background:var(--accent); color:#fff; font-size:10px; padding:1px 5px; border-radius:4px; }
  .muted { color:var(--muted); font-size:13px; }
  .msg { padding:10px; border-radius:8px; background:#fff6e5; border:1px solid #f0d9a8; margin:10px 0; }
  .err { background:#fdecee; border-color:#f3bcc4; }
  .hidden { display:none !important; }
  table { width:100%; border-collapse:collapse; font-size:14px; } td, th { border-bottom:1px solid var(--line); padding:6px; text-align:left; vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  h2 { font-size:18px; margin:4px 0 10px; } h3 { font-size:15px; margin:16px 0 6px; }
  .count { font-size:13px; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips label { display:flex; gap:6px; align-items:center; margin:0; padding:5px 9px; border:1px solid var(--line); border-radius:16px; color:var(--ink); font-size:13px; }
  .chip { display:inline-flex; gap:6px; align-items:center; background:#efe7dc; border-radius:14px; padding:3px 10px; font-size:13px; }
  .chip button { border:0; background:none; padding:0 2px; }
  .pick { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; max-height:420px; overflow:auto; padding:4px; border:1px solid var(--line); border-radius:8px; }
  .pick label { display:block; margin:0; position:relative; border:1px solid var(--line); border-radius:8px; overflow:hidden; color:var(--ink); font-size:12px; cursor:pointer; background:#fff; }
  .pick label.on { outline:3px solid var(--accent); }
  .pick img, .pick .noimg { width:100%; aspect-ratio:1; object-fit:contain; background:#f1efea; display:block; }
  .pick input { position:absolute; top:5px; left:5px; width:20px; height:20px; accent-color:var(--accent); }
  .pick span { display:block; padding:4px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

</style>

async function resizeImage(file, max = 2600) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.9));
  } finally { URL.revokeObjectURL(url); }
}
async function uploadPhotos(work, files, startSort = 0) {
  let i = startSort;
  for (const f of files) {
    const blob = await resizeImage(f);
    const path = `${work.artist_id}/${work.id}/${crypto.randomUUID()}.jpg`;
    const up = await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg' });
    if (up.error) throw up.error;
    const ins = await sb.from('photos').insert({ work_id: work.id, path, sort: i++ });
    if (ins.error) throw ins.error;
  }
}

    height_cm: readDim('eH'), width_cm: readDim('eW'), depth_cm: readDim('eD'),

function goPrints() {
  pWork = editing; if (!pWork) return;
  $('pHead').textContent = pWork.title + (pWork.year ? ', ' + pWork.year : '');
  $('pSub').textContent = [pWork.code, pWork.technique, sizeText(pWork, false)].filter(Boolean).join(' · ');
  $('pThumb').src = pWork.photos[0] ? photoUrl(pWork.photos[0].path) : '';
  pEditing = null; renderPrints(); show('vPrints');
}
function renderPrints() { renderEdTable(); fillPrintForm(pEditing); }
function renderEdTable() {
  const eds = (works.find(w => w.id === pWork.id) || pWork).eds;
  $('pTable').innerHTML = eds.length
    ? `<tr><th>${t('pmedium')}</th><th>${unit === 'in' ? 'in / cm' : 'cm / in'}</th><th>${t('pedition')}</th><th>${t('ap_short')}</th><th>${t('pprinted')}</th><th>${t('psold')}</th><th>${priceHdr()}</th><th></th></tr>` +
      eds.map(e => `<tr><td>${esc(e.medium || '')}</td><td>${esc(edSize(e))}</td><td>${e.edition_size ?? ''}</td><td>${e.ap_count ?? ''}</td><td>${e.printed_count ?? ''}</td><td>${e.sold_count ?? ''}</td><td>${money(e.price_usd)}</td><td><button data-ped="${e.id}">${t('edit')}</button></td></tr>`).join('')
    : `<tr><td class="muted">${t('noprints')}</td></tr>`;
}
function fillPrintForm(e) {
  pEditing = e || null;
  $('pFormHead').textContent = e ? t('editedition') : t('newedition');
  const v = (id, x) => $(id).value = x ?? '';
  v('pMedium', e?.medium); setDim('pH', e?.height_cm); setDim('pW', e?.width_cm); v('pEd', e?.edition_size); v('pAP', e?.ap_count);
  v('pPrinted', e?.printed_count); v('pSold', e?.sold_count); v('pPrice', e?.price_usd); v('pPrinter', e?.printer); v('pDate', e?.print_date); v('pNotes', e?.notes);
  $('btnPDel').classList.toggle('hidden', !e); updPInches(); msg($('pMsg'), '');
  if ((e?.id || null) !== lastEdId) copySel = new Set();
  lastEdId = e?.id || null; renderCopies();
}
function updPInches() { const d = ['pH','pW'].map(readDim).filter(v => v != null); $('pInches').textContent = otherUnitHint(d); $('pPriceHint').textContent = cur === 'MXN' ? mxnHint(num($('pPrice').value)) : ''; }
function otherUnitHint(d) {
  if (!d.length) return '';
  return unit === 'in' ? `${t('cms')}: ${d.map(fmtNum).join(' x ')} cm` : `${t('inches')}: ${d.map(inch).join(' x ')} in`;
}
function updPriceHints() {
  $('ePriceHint').textContent = cur === 'MXN' ? mxnHint(num($('ePrice').value)) : '';
  $('eSaleHint').textContent = cur === 'MXN' ? mxnHint(num($('eSale').value)) : '';
}
async function savePrint() {
  const s = id => $(id).value.trim() || null;
  const rec = { work_id: pWork.id, medium: s('pMedium'), height_cm: readDim('pH'), width_cm: readDim('pW'),
    edition_size: num($('pEd').value), ap_count: num($('pAP').value), printed_count: num($('pPrinted').value), sold_count: num($('pSold').value),
    price_usd: num($('pPrice').value), printer: s('pPrinter'), print_date: $('pDate').value || null, notes: s('pNotes') };
  if (!rec.medium && rec.edition_size == null) { markMissing($('pMedium')); $('pEd').classList.add('missing'); $('pEd').addEventListener('input', () => { $('pEd').classList.remove('missing'); $('pMedium').classList.remove('missing'); }, { once:true }); msg($('pMsg'), t('reqone'), true); return; }
  const r = pEditing ? await sb.from('print_editions').update(rec).eq('id', pEditing.id).select().single() : await sb.from('print_editions').insert(rec).select().single();
  if (r.error) { msg($('pMsg'), r.error.message, true); return; }
  await loadWorks(); pEditing = curEd(r.data.id); renderPrints(); msg($('pMsg'), t('saved'));
}
async function deletePrint() {
  if (!pEditing || !confirm(t('confirmdel'))) return;
  const r = await sb.from('print_editions').delete().eq('id', pEditing.id);
  if (r.error) { msg($('pMsg'), r.error.message, true); return; }
  await loadWorks(); pEditing = null; renderPrints();
}
let copySel = new Set(), lastEdId = null;
const curWork = () => works.find(w => w.id === pWork.id) || pWork;
const curEd = id => curWork().eds.find(e => e.id === id) || null;
const copyLabel = (c, e, forCoa) => c.kind === 'ap' ? `${forCoa ? 'P/A' : t('ap_short')} ${c.number}` : `${c.number}/${e.edition_size ?? '?'}`;
function renderCopies() {
  const e = pEditing;
  $('pCopiesWrap').classList.toggle('hidden', !e);
  if (!e) return;
  const cl = clients.filter(c => c.artist_id === curWork().artist_id);
  const n = copySel.size ? ` (${copySel.size})` : '';
  $('btnCopyCoas').textContent = t('printcoas') + n;
  $('cTable').innerHTML = e.copies.length ? `<tr><th></th><th>${t('copy')}</th><th>${t('status')}</th><th>${t('owner')}</th><th>${t('solddate')}</th><th>${t('saleprice')}</th><th>${t('coa')}</th></tr>` +
    e.copies.map(c => `<tr data-cid="${c.id}">
      <td><input type="checkbox" class="csel" ${copySel.has(c.id) ? 'checked' : ''}></td>
      <td style="white-space:nowrap"><b>${esc(copyLabel(c, e))}</b></td>
      <td><select data-f="status">${['available','reserved','sold','gift','artist'].map(st => opt(st, t('cst_' + st), c.status === st)).join('')}</select></td>
      <td><select data-f="owner_client_id">${opt('', t('none'))}${cl.map(x => opt(x.id, x.name, c.owner_client_id === x.id)).join('')}</select></td>
      <td><input type="date" data-f="sold_date" value="${esc(c.sold_date || '')}"></td>
      <td><input type="number" data-f="sale_price_usd" value="${c.sale_price_usd ?? ''}" style="width:7em"></td>
      <td class="muted" style="white-space:nowrap">${c.coa_issued ? fmtDate(c.coa_issued) : ''}</td></tr>`).join('')
    : `<tr><td class="muted">—</td></tr>`;
}
async function genCopies() {
  const e = pEditing; if (!e) return;
  if (!e.edition_size) { $('cMsg').textContent = t('needsize'); return; }
  const have = new Set(e.copies.map(c => c.kind + ':' + c.number));
  const rows = [];
  for (let i = 1; i <= e.edition_size; i++) if (!have.has('numbered:' + i)) rows.push({ edition_id: e.id, kind: 'numbered', number: i });
  for (let i = 1; i <= (e.ap_count || 0); i++) if (!have.has('ap:' + i)) rows.push({ edition_id: e.id, kind: 'ap', number: i });
  if (rows.length) { const r = await sb.from('print_copies').insert(rows); if (r.error) { $('cMsg').textContent = r.error.message; return; } }
  await loadWorks(); pEditing = curEd(e.id); renderPrints(); $('cMsg').textContent = t('saved');
}
async function saveCopyField(cid, field, value) {
  const upd = { [field]: value === '' ? null : (field === 'sale_price_usd' ? Number(value) : value) };
  if (field === 'owner_client_id' && value) { const c = pEditing.copies.find(x => x.id === cid); if (c && c.status === 'available') upd.status = 'sold'; }
  const r = await sb.from('print_copies').update(upd).eq('id', cid);
  if (r.error) { $('cMsg').textContent = r.error.message; return; }
  const id = pEditing.id; await loadWorks(); pEditing = curEd(id); renderPrints(); $('cMsg').textContent = t('saved');
}
async function printCopyCoas() {
  const e = pEditing; if (!e) return;
  const list = copySel.size ? e.copies.filter(c => copySel.has(c.id)) : e.copies;
  if (!list.length) { alert(t('nothingsel')); return; }
  const w = curWork(), a = artists.find(x => x.id === w.artist_id) || {};
  const today = new Date().toISOString().slice(0, 10);
  const dEs = d => new Date(d + 'T12:00:00').toLocaleDateString('es-MX', { year:'numeric', month:'long', day:'numeric' });
  const head = coasHtml([], today)[0];
  const body = list.map(c => {
    const rows = [
      ['Artista / Artist', a.name],
      ['Obra original / Original work', w.title + (w.year ? ', ' + w.year : '')],
      ['Técnica / Medium', e.medium],
      ['Medidas / Size', edSize(e)],
      ['Ejemplar / Print no.', copyLabel(c, e, true) + (c.kind === 'ap' ? '' : (e.ap_count ? `  (+ ${e.ap_count} P/A)` : ''))],
      ['Impresor / Printer', e.printer],
      ['Fecha de impresión / Printed', e.print_date ? dEs(e.print_date) : ''],
      ['Registro / Inventory no.', (w.code || '') + ' · ' + copyLabel(c, e, true)],
      c.owner_client_id ? ['Propietario / Owner', clientName(c.owner_client_id)] : null
    ].filter(r => r && r[1]);
    const issued = c.coa_issued || today;
    return `<div class="sq">
      <div class="hd"><div class="a">CERTIFICADO DE AUTENTICIDAD</div><div class="b">CERTIFICATE OF AUTHENTICITY · REPRODUCCIÓN / PRINT</div><div class="rule"></div></div>
      <div class="img">${w.photos[0] ? `<img src="${photoUrl(w.photos[0].path)}">` : ''}</div>
      <div class="ttl">${esc(w.title)}${w.year ? ', ' + w.year : ''}</div>
      <table>${rows.map(r => `<tr><td class="k">${r[0]}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>
      <div class="st">Certifico que esta reproducción, numerada y firmada, forma parte de una edición limitada${e.edition_size ? ' de ' + e.edition_size + ' ejemplares' : ''} realizada con mi autorización.<br>
        <i>I certify that this signed and numbered print is part of a limited edition${e.edition_size ? ' of ' + e.edition_size : ''} made with my authorization.</i></div>
      <div class="sig"><div class="pd">${esc(a.city || '')}${a.city ? ', ' : ''}${dEs(issued)}</div><div class="line">${esc(a.name || '')}</div></div>
    </div>`;
  }).join('');
  printWindow(head, body);
  const toMark = list.filter(c => !c.coa_issued).map(c => c.id);
  if (toMark.length) { await sb.from('print_copies').update({ coa_issued: today }).in('id', toMark); const id = e.id; await loadWorks(); pEditing = curEd(id); renderCopies(); }
}
function backFromPrints() { openEdit(works.find(w => w.id === pWork.id) || pWork); }

// ---------- team (artist helpers) and admins ----------
async function goTeam(mode) {
  teamMode = mode; setNav(mode);
  $('tHead').textContent = t(mode); $('tHelp').textContent = t(mode + 'help');
  $('tArtistWrap').classList.toggle('hidden', !(mode === 'team' && isAdmin));
  if (mode === 'team' && isAdmin) { const cur = $('tArtist').value; $('tArtist').innerHTML = artists.map(a => opt(a.id, a.name)).join(''); if (cur) $('tArtist').value = cur; }
  $('tEmail').value = ''; msg($('tMsg'), '');
  show('vTeam'); await renderTeam();
}
const teamArtist = () => isAdmin ? $('tArtist').value : myArtist.id;
async function renderTeam() {
  let rows = [], head = '';
  if (teamMode === 'admins') {
    rows = (await sb.from('admins').select('email').order('email')).data || [];
    $('tTable').innerHTML = rows.map(r => `<tr><td>${esc(r.email)}</td><td style="text-align:right">${r.email.toLowerCase() === me.email.toLowerCase() ? `<span class="muted">${t('you')}</span>` : `<button class="danger" data-rm="${esc(r.email)}">${t('remove')}</button>`}</td></tr>`).join('');
  } else {
    const aid = teamArtist(); const a = artists.find(x => x.id === aid);
    rows = (await sb.from('artist_members').select('email').eq('artist_id', aid).order('email')).data || [];
    head = a?.email ? `<tr><td>${esc(a.email)}</td><td style="text-align:right" class="muted">${t('owner_t')}</td></tr>` : '';
    $('tTable').innerHTML = head + rows.map(r => `<tr><td>${esc(r.email)}</td><td style="text-align:right"><button class="danger" data-rm="${esc(r.email)}">${t('remove')}</button></td></tr>`).join('');
  }
}
async function teamAdd() {
  const email = $('tEmail').value.trim().toLowerCase();
  if (!/^\S+@\S+\.\S+$/.test(email)) { markMissing($('tEmail')); msg($('tMsg'), t('needname'), true); return; }
  const r = teamMode === 'admins' ? await sb.from('admins').insert({ email }) : await sb.from('artist_members').insert({ artist_id: teamArtist(), email });
  if (r.error) { msg($('tMsg'), r.error.message, true); return; }
  $('tEmail').value = ''; msg($('tMsg'), t('saved')); renderTeam();
}
async function teamRemove(email) {
  if (!confirm(t('confirmdel'))) return;
  const r = teamMode === 'admins' ? await sb.from('admins').delete().eq('email', email) : await sb.from('artist_members').delete().eq('artist_id', teamArtist()).eq('email', email);
  if (r.error) { msg($('tMsg'), r.error.message, true); return; }
  renderTeam();
}

// ---------- import ----------
const CECILIA = [
  ['DOS VERSOS',2026,'Acrilico sobre tela de algodon',140,260,9000,'dos versos.jpeg'],
  ['GUIÑO DE MAR',2025,'Oleo sobre tela',152,122,7200,'Guinio de mar.jpeg'],
  ['Palpito de mar 1',2026,'Acrilico sobre tela de algodon',220,110,7200,'palpito de mar 1.jpeg'],
  ['Palpito de mar II',2026,'Acrilico sobre tela de algodon',220,110,7200,'Palpito de mar 2.jpeg'],
  ['SONATA',2026,'Acrilico sobre tela de algodon',150,120,7000,'sonata.jpeg'],
  ['DECANTACIONES',2026,'Acrilico sobre tela',210,90,7200,'Decantaciones.jpeg'],
  ['INTUICIONES',2025,'Acrilico y Oleo sobre tela',110,110,4200,'intuiciones.jpeg'],
  ['ROSETE',2026,'Acrilico sobre tela',150,100,4800,'Rosete.jpeg'],
  ['Gacela',2025,'Acrilico sobre tela',50,50,1200,'gacela .jpeg'],
  ['Rastro',2025,'Acrilico sobre tela',50,50,1200,'Rastro.jpeg'],
  ['ARQUITECTURA',2025,'Acrilico y Pastel sobre papel',76,56,1800,'arquitectura.jpeg'],
  ['PROSA',2025,'Acrilico y Pastel sobre papel',37,28,1400,'prosa.jpeg'],
  ['VERSO',2025,'Acrilico y Pastel sobre papel',37,28,1400,'verso.jpeg'],
  ['Memoria de Egipto',2024,'Acrilico y Pastel sobre papel',42,31,1600,'Memorias de Egipto.jpeg']
];
async function runImport() {
  const out = $('iMsg'); $('btnIRun').disabled = true;
  try {
    const name = $('iName').value.trim(), email = $('iEmail').value.trim().toLowerCase() || null, prefix = $('iPrefix').value.trim().toUpperCase();
    let a = artists.find(x => x.code_prefix === prefix) || (email && artists.find(x => x.email === email));
    if (!a) { const r = await sb.from('artists').insert({ name, email, code_prefix: prefix }).select().single(); if (r.error) throw r.error; a = r.data; }
    const existing = await sb.from('works').select('id', { count: 'exact', head: true }).eq('artist_id', a.id);
    if (existing.count) { msg(out, t('importexists'), true); return; }
    const files = [...$('iFiles').files];
    const byName = n => files.find(f => f.name.trim().toLowerCase() === n.trim().toLowerCase());
    let n = 0;
    for (const [title, year, tech, h, w, price, fname] of CECILIA) {
      msg(out, `${++n}/14 · ${title}…`);
      const r = await sb.from('works').insert({ artist_id: a.id, title, year, technique: tech, height_cm: h, width_cm: w, price_usd: price, status: 'available', edition: t('unique') }).select().single();
      if (r.error) throw r.error;
      const f = byName(fname); if (f) await uploadPhotos(r.data, [f]);
    }
    await loadAll(); msg(out, t('importdone').replace('{n}', n));
  } catch (e) { msg(out, e.message || String(e), true); }
  finally { $('btnIRun').disabled = false; }
}

// ---------- events ----------
$('btnLang').onclick = $('btnLang2').onclick = toggleLang;
$('btnCur').onclick = toggleCur;
$('btnUnit').onclick = toggleUnit;
$('rateInfo').onclick = editRate;
$('ePrice').oninput = $('eSale').oninput = updPriceHints;
$('pPrice').oninput = updPInches;
$('btnLogin').onclick = async () => {
  const r = await sb.auth.signInWithPassword({ email: $('lEmail').value.trim(), password: $('lPass').value });
  if (r.error) msg($('lMsg'), r.error.message, true); else await enter(r.data.session);
};
$('btnSignup').onclick = async () => {
  const r = await sb.auth.signUp({ email: $('lEmail').value.trim(), password: $('lPass').value });
  if (r.error) msg($('lMsg'), r.error.message, true); else if (r.data.session) await enter(r.data.session); else msg($('lMsg'), t('signupok'));
};
$('btnOut').onclick = async () => { await sb.auth.signOut(); location.reload(); };
document.querySelectorAll('header [data-nav]').forEach(b => b.onclick = () => {
  const n = b.dataset.nav;
  if (n === 'team' || n === 'admins') { goTeam(n); return; }
  if (n === 'works') goWorks(); else if (n === 'import') { setNav('import'); msg($('iMsg'), ''); show('vImport'); } else goEnt(n);
});
$('btnNew').onclick = () => openEdit(null);
$('btnCancel').onclick = goWorks;
$('btnSave').onclick = () => saveWork();
$('btnDel').onclick = deleteWork;
$('btnOneCard').onclick = () => editing && printCards([editing]);
$('btnOneCoa').onclick = () => editing && printCoas([editing]);
$('eArtist').onchange = () => fillWorkSelects(editing);
$('eH').oninput = $('eW').oninput = $('eD').oninput = updInches;
$('btnCam').onclick = () => $('eCam').click();
$('btnPick').onclick = () => $('eFiles').click();
$('eCam').onchange = e => { addPending([...e.target.files]); e.target.value = ''; };
$('eFiles').onchange = e => { addPending([...e.target.files]); e.target.value = ''; };
$('ePending').onclick = e => { const i = e.target.dataset?.pend; if (i != null) { URL.revokeObjectURL(pending[i].url); pending.splice(+i, 1); renderPending(); } };
$('eThumbs').onclick = e => { const id = e.target.dataset?.pid; if (id) deletePhoto(id); const st = e.target.dataset?.star; if (st) makeMainPhoto(st); };
['fArtist','fStatus','fPlace','fExh'].forEach(id => $(id).onchange = renderList);
$('fText').oninput = renderList;
$('fOwnerBox').onclick = e => { if (e.target.id === 'clrOwner') { fOwner = null; renderList(); } };
$('grid').onclick = e => {
  if (e.target.classList.contains('sel')) { const id = e.target.dataset.id; e.target.checked ? selected.add(id) : selected.delete(id); renderList(); return; }
  const card = e.target.closest('.work'); if (card) openEdit(works.find(w => w.id === card.dataset.id));
};
$('btnSelAll').onclick = () => { const f = filtered(); const all = f.length && f.every(w => selected.has(w.id)); f.forEach(w => all ? selected.delete(w.id) : selected.add(w.id)); renderList(); };
$('btnSelClear').onclick = () => { selected.clear(); renderList(); };
$('btnCards').onclick = () => printCards(printList());
$('btnCoas').onclick = () => printCoas(printList());
$('btnList').onclick = () => printPriceList(printList());
$('btnBulk').onclick = applyBulk;
$('entTable').onclick = e => {
  const rows = entRows(curEnt);
  if (e.target.dataset.edit) { entEditing = rows.find(r => r.id === e.target.dataset.edit); renderEntForm(); window.scrollTo(0, document.body.scrollHeight); }
  if (e.target.dataset.show) ENT[curEnt].showWorks(rows.find(r => r.id === e.target.dataset.show));
};
$('btnEntSave').onclick = saveEnt;
$('btnEntNew').onclick = () => { entEditing = null; renderEntForm(); };
$('btnEntDel').onclick = deleteEnt;
$('btnIRun').onclick = runImport;
$('btnTAdd').onclick = teamAdd;
$('eHires').oninput = updHires;
$('btnPrints').onclick = async () => { if (await saveWork(true)) goPrints(); };
$('btnPSave').onclick = savePrint;
$('btnPNew').onclick = () => fillPrintForm(null);
$('btnPDel').onclick = deletePrint;
$('btnPBack').onclick = backFromPrints;
$('pH').oninput = $('pW').oninput = updPInches;
$('btnGenCopies').onclick = genCopies;
$('btnCopyCoas').onclick = printCopyCoas;
$('btnCopySelAll').onclick = () => { const all = pEditing.copies.length && pEditing.copies.every(c => copySel.has(c.id)); pEditing.copies.forEach(c => all ? copySel.delete(c.id) : copySel.add(c.id)); renderCopies(); };
$('cTable').onchange = e => {
  const tr = e.target.closest('tr'); const cid = tr?.dataset.cid; if (!cid) return;
  if (e.target.classList.contains('csel')) { e.target.checked ? copySel.add(cid) : copySel.delete(cid); renderCopies(); return; }
  if (e.target.dataset.f) saveCopyField(cid, e.target.dataset.f, e.target.value);
};
$('pTable').onclick = e => { const id = e.target.dataset?.ped; if (id) { const w = works.find(x => x.id === pWork.id) || pWork; fillPrintForm(w.eds.find(x => x.id === id)); } };
$('tArtist').onchange = renderTeam;
$('tTable').onclick = e => { const em = e.target.dataset?.rm; if (em) teamRemove(em); };

boot();
</script>
